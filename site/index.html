async function boot(){
 const bad=!CFG.url||!CFG.key||/YOUR[-_]/i.test(CFG.url+CFG.key);
 if(bad)return notReady("Open <code>site/config.js</code> in the repository and paste your Supabase Project URL and publishable key, then commit.");
 let role="";try{role=JSON.parse(atob(CFG.key.split(".")[1].replace(/-/g,"+").replace(/_/g,"/"))).role}catch(x){}
 if(role==="service_role"||/^sb_secret_/.test(CFG.key))return notReady("<b>config.js contains a SECRET key.</b> Remove it now, commit, and rotate that key in Supabase. Only the publishable (or anon) key belongs here.");
 if(!window.supabase)return notReady("The Supabase library did not load. Check the internet connection and reload.");
 sb=sb||supabase.createClient(CFG.url,CFG.key);const{data:{session}}=await sb.auth.getSession();
 if(!session){S.user=null;S.wait=null;render();return}
 try{const p=await sb.from("profiles").select("role,display_name,username,status").eq("id",session.user.id).single();
  if(p.error||!p.data)throw new Error("This account has no profile. Ask the administrator.");const pr=p.data;
  if(pr.status!=="approved"||!pr.role){S.user=null;S.wait={s:pr.status,n:pr.display_name};render();return}
  S.wait=null;S.user={role:pr.role,name:pr.display_name,username:pr.username,uid:session.user.id};await loadAll();
  if(S.user.role==="teacher"){const f=DB.fac.find(x=>x.pid===S.user.uid);if(!f)throw new Error("No faculty record is linked to this account yet. Ask the administrator.");S.user.id=f.id}
  subscribe();startRepeat();render()}
 catch(e){const m=e.message||"Could not load data";await sb.auth.signOut();S.user=null;S.wait=null;render();const x=$("#err");if(x)x.textContent=m}}
async function doLogin(){const d=new FormData($("#lf")),u=d.get("u").trim().toLowerCase(),r=await sb.auth.signInWithPassword({email:uemail(u),password:d.get("p")});
 if(r.error){$("#err").textContent=/invalid login/i.test(r.error.message)?"Incorrect ID or password.":r.error.message;return}S.page="";await boot()}
async function doRegister(){const d=new FormData($("#rg")),u=d.get("u").trim().toLowerCase(),n=d.get("n").trim().toUpperCase(),p=d.get("p"),e=m=>{$("#err").textContent=m};
 if(!UNAME.test(u))return e("ID: 3 to 20 letters, numbers, . _ or - (no spaces).");
 if(!n.includes(",")||n.split(",")[1].trim()==="")return e("Write your name as LAST NAME, FIRST NAME.");
 if(p.length<8)return e("Password needs at least 8 characters.");if(p!==d.get("p2"))return e("The two passwords do not match.");
 e("Checking…");const av=await sb.rpc("username_available",{p_username:u});if(av.error)return e(av.error.message);if(!av.data)return e("That ID is already registered. If it is yours, ask the administrator.");
 const s=await sb.auth.signUp({email:uemail(u),password:p,options:{data:{username:u,display_name:n,requested_role:d.get("r")}}});
 if(s.error){const m=s.error.message;return e(/already.*registered/i.test(m)?"That ID is already registered.":/database error/i.test(m)?"Could not create the account. Too many requests may be waiting. Ask the administrator.":/invalid/i.test(m)?"Sign-up refused (email format). Ask the administrator to change emailDomain in config.js.":m)}
 if(!s.data.session)return e("Account created, but sign-in is blocked. Ask the administrator to turn OFF “Confirm email” in Supabase.");
 S.reg=false;await boot()}

 if(r.error){const msg=await fnErr(r.error);if(vid)await sb.rpc("mark_alert_failed",{p_visitor:vid,p_error:msg});return{s:"failed",err:msg}}return r.data}

function subscribe(){if(ch)sb.removeChannel(ch);let tm;const re=()=>{clearTimeout(tm);tm=setTimeout(async()=>{try{await loadAll();if(S.page==="rec")await loadMonth()}catch(e){return}soft()},400)};
 ch=sb.channel("dhs");["visitors","faculty","notifications",...(S.user&&S.user.role==="admin"?["profiles"]:[])].forEach(tb=>ch.on("postgres_changes",{event:"*",schema:"public",table:tb},p=>{

  if(tb==="notifications"&&p.eventType==="INSERT"&&rl==="teacher"){toast((n.priority==="urgent"?"URGENT: ":"")+"A visitor is waiting for you.");alertFx(n.priority==="urgent")}
  if(tb==="notifications"&&p.eventType==="UPDATE"&&rl!=="teacher"&&n.reply){const o=DB.nt.find(x=>x.id===n.id);if(!o||o.reply!==n.reply){toast(((findF(n.faculty_id)||{}).name||"Teacher")+": "+REPLY[n.reply]);alertFx(false)}}
  re()}));ch.subscribe()}

async function submitReg(){const f=$("#rf");if(!f.reportValidity())return;const d=new FormData(f),fid=+d.get("fac"),fac=findF(fid);if(!fac)return toast("Choose a teacher or office.");
 const row={name:d.get("name").trim(),contact:d.get("contact").trim()||null,purpose:d.get("purpose"),purpose_other:(d.get("other")||"").trim()||null,priority:d.get("prio")==="urgent"?"urgent":"normal",faculty_id:fid,faculty_name:fac.name};
 if(!row.name||(row.purpose==="other"&&!row.purpose_other))return toast("Please fill in the required fields.");
 const ins=await sb.from("visitors").insert(row).select().single();if(ins.error)return toast("Could not save the visitor: "+ins.error.message);
 DB.vis.unshift(mapV(ins.data));f.reset();togOther();hint();setLast(`${esc(row.name)} saved to the database. Sending alert…`);
 const r=await alertFn({visitor_id:ins.data.id},ins.data.id),u=row.priority==="urgent";
 const m=r.s==="accepted"?`Visitor saved. The push service accepted the ${u?"URGENT ":""}alert for ${fac.name} (${r.sent} phone${r.sent>1?"s":""}). Phone display is not confirmed until the teacher answers.`:r.s==="nodevice"?`Visitor saved. ${fac.name} has no phone registered, so no push alert was sent. The in-app inbox still has it.`:`Visitor saved, but the alert failed: ${r.err}`;
 setLast(`${esc(row.name)} → ${esc(fac.name)}${urgB(row.priority)}<br>${pill(r)}`);toast(m);loadAll().catch(()=>{})}

const b64u=s=>{s=s.replace(/-/g,"+").replace(/_/g,"/");return Uint8Array.from(atob(s+"=".repeat((4-s.length%4)%4)),c=>c.charCodeAt(0))};
const swReady=()=>Promise.race([navigator.serviceWorker.ready,new Promise((_,r)=>setTimeout(()=>r(new Error("The background service is not running. Open the site over https (GitHub Pages).")),4000))]);
async function enablePush(){
 if(!("serviceWorker" in navigator&&"PushManager" in window&&"Notification" in window))return toast("This browser cannot receive phone alerts. Use Chrome on Android.");
 if(Notification.permission==="denied")return toast("Notifications are blocked. Allow them for this app in the phone settings, then try again.");
 try{const perm=await Notification.requestPermission();if(perm!=="granted")return toast("Permission was not granted.");
  const reg=await swReady(),k=await sb.functions.invoke("send-alert",{body:{action:"vapid_public"}});if(k.error)return toast(await fnErr(k.error));
  const old=await reg.pushManager.getSubscription();if(old)await old.unsubscribe();
  const j=(await reg.pushManager.subscribe({userVisibleOnly:true,applicationServerKey:b64u(k.data.key)})).toJSON();
  const r=await sb.rpc("register_push",{p_endpoint:j.endpoint,p_p256dh:j.keys.p256dh,p_auth:j.keys.auth,p_ua:navigator.userAgent});if(r.error)return toast("Could not save this phone: "+r.error.message);
  await refresh();toast("Alerts are on for this phone. Press Send test to check.")}catch(e){toast("Could not turn on alerts: "+(e.message||e))}}
async function disablePush(){try{const s=await(await swReady()).pushManager.getSubscription();if(s){await sb.rpc("unregister_push",{p_endpoint:s.endpoint});await s.unsubscribe()}await refresh();toast("Alerts turned off on this phone.")}catch(e){toast("Could not turn off: "+(e.message||e))}}
async function pushStatus(){let m="This phone is not set up yet.";
 try{if(!("serviceWorker" in navigator&&"PushManager" in window))m="This browser cannot receive alerts. Use Chrome on Android.";else if(Notification.permission==="denied")m="Notifications are blocked in the phone settings.";else{const s=await(await swReady()).pushManager.getSubscription();if(s&&Notification.permission==="granted")m="Alerts are ON for this phone."}}catch(x){m=x.message}
 const el=$("#ps");if(el)el.textContent=m}
// Auto-resend: while a guard/admin page is open, re-send an unanswered urgent alert every 2 minutes, at most 3 times. The server enforces the same limits.
function startRepeat(){clearInterval(rep_t);if(!S.user||S.user.role==="teacher")return;
 rep_t=setInterval(async()=>{if(repBusy||!sb)return;repBusy=true;
  try{let sent=false;for(const n of unackUrgent())if(n.push.s==="accepted"&&n.reps<3&&Date.now()-new Date(n.push.at)>=12e4){await sb.functions.invoke("send-alert",{body:{notification_id:n.id,resend:true,auto:true}});sent=true}
   if(sent){await loadAll();soft()}}catch(e){}finally{repBusy=false}},30000)}
